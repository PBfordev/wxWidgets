# Setup config for CI jobs on CircleCI (circleci.com).
#
# The actual jobs are defined in continue_config.yml and only run if
# something other than the Windows-only code has changed.
version: 2.1

setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  setup:
    jobs:
      - path-filtering/filter:
          base-revision: master
          config-path: .circleci/continue_config.yml
          mapping: |
            .* run-build true
          exclude: |
            include/wx/msw/.*
            src/msw/.*
